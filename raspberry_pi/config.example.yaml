# Нусхаро ба config.yaml гиред ва қиматҳоро пур кунед:
#   cp config.example.yaml config.yaml

anthropic_api_key: "YOUR_API_KEY_HERE"

serial_port: "/dev/ttyUSB0"   # дар Raspberry Pi одатан /dev/ttyUSB0 ё /dev/ttyACM0
serial_baud: 115200

camera_index: 0

robot_name: "Робот"

# Забони асосии STT (гӯш кардан). Агар хидмати STT "tg-TJ"-ро дастгирӣ
# накунад, худкор ба fallback_language мегузарад (нигаред speech_to_text.py).
language: "tg-TJ"
fallback_language: "ru-RU"

# Забони TTS (гуфтор), номи забон дар espeak-ng, масалан "tg" (тоҷикӣ) ё
# "ru" (русӣ) агар овози тоҷикӣ дар система набошад.
tts_language: "tg"

# Агар холӣ монед — робот пайваста гӯш мекунад (бе калимаи бедоркунӣ).
wake_word: null
